services:
  - type: web
    name: scopeshield-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: render
      - key: FRONTEND_ORIGIN
        value: https://scopeshield.tech
      - key: DATABASE_URL
        sync: false
      - key: TABPFN_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: GEMMA_MODE
        value: stub
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: scopeshield-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://scopeshield-api.onrender.com/api/$1
